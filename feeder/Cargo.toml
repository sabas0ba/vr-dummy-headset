[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/core",
    "crates/cli",
    "crates/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/sabas0ba/vr-dummy-headset"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Product names (SteamVR, VRChat, OpenVR) appear throughout the documentation.
doc_markdown = "allow"
# Numeric conversions between f32/f64/u32 are intrinsic to pose and wire handling.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
similar_names = "allow"
