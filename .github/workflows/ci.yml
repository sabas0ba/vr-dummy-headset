name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  driver:
    name: driver (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # No generator is named so that CMake picks the Visual Studio version
      # installed on the runner image; the local preset pins VS 2022.
      - name: Configure
        working-directory: driver
        run: cmake -S . -B build/ci -A x64 -DVRDUMMY_BUILD_TESTS=ON -DVRDUMMY_WARNINGS_AS_ERRORS=ON

      - name: Build
        working-directory: driver
        run: cmake --build build/ci --config Release

      - name: Test
        working-directory: driver
        run: ctest --test-dir build/ci -C Release --output-on-failure

      - name: Upload driver folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: driver_vrdummy
          path: driver/build/ci/vrdummy
          if-no-files-found: error

  feeder:
    name: feeder (Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain version comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Format
        working-directory: feeder
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: feeder
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        working-directory: feeder
        run: cargo test --workspace --locked

      - name: Build release binaries
        working-directory: feeder
        run: cargo build --release --locked -p vrdummy-cli -p vrdummy-gui

      - name: Upload feeder binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feeder
          path: |
            feeder/target/release/vrdummy-cli.exe
            feeder/target/release/vrdummy-gui.exe
          if-no-files-found: error

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        env:
          # The action's container has its own toolchain; ignore rust-toolchain.toml there.
          RUSTUP_TOOLCHAIN: stable
        with:
          manifest-path: feeder/Cargo.toml
          command: check
          arguments: --all-features
